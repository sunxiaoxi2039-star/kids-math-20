<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Obsidian × OpenCL Aw 本地知识库引导</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0b1020;
      --panel: rgba(20, 27, 45, 0.88);
      --muted: #9fb0d0;
      --line: rgba(162, 180, 218, 0.25);
      --brand: #7c9cff;
      --brand-2: #4de2c5;
      --ok: #3ecf8e;
      --warn: #ffd166;
    }

    body {
      font-family: "Inter", "PingFang SC", "Microsoft YaHei", sans-serif;
      color: #e8efff;
      min-height: 100vh;
      background:
        radial-gradient(circle at 20% 10%, rgba(124, 156, 255, 0.18), transparent 35%),
        radial-gradient(circle at 80% 0%, rgba(77, 226, 197, 0.14), transparent 30%),
        var(--bg);
      padding: 28px 18px 40px;
    }

    .shell {
      max-width: 1100px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 290px 1fr;
      gap: 18px;
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 16px;
      backdrop-filter: blur(8px);
    }

    .sidebar {
      padding: 18px;
      position: sticky;
      top: 14px;
      height: fit-content;
    }

    .sidebar h1 {
      font-size: 1.1rem;
      line-height: 1.4;
      margin-bottom: 8px;
    }

    .subtitle {
      font-size: 0.9rem;
      color: var(--muted);
      line-height: 1.6;
      margin-bottom: 16px;
    }

    .progress-wrap {
      margin: 14px 0 20px;
    }

    .progress-label {
      font-size: 0.8rem;
      color: var(--muted);
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
    }

    .progress {
      width: 100%;
      height: 8px;
      border-radius: 999px;
      background: rgba(140, 160, 200, 0.25);
      overflow: hidden;
    }

    .progress > i {
      display: block;
      height: 100%;
      width: 0;
      transition: width 0.35s;
      background: linear-gradient(90deg, var(--brand), var(--brand-2));
    }

    .steps {
      list-style: none;
      display: grid;
      gap: 8px;
    }

    .step-item {
      padding: 10px 12px;
      border: 1px solid transparent;
      border-radius: 10px;
      color: var(--muted);
      cursor: pointer;
      transition: 0.2s;
      font-size: 0.9rem;
    }

    .step-item:hover { border-color: var(--line); color: #d9e6ff; }
    .step-item.active { border-color: var(--brand); color: #ffffff; background: rgba(124, 156, 255, 0.15); }
    .step-item.done::after { content: " ✓"; color: var(--ok); }

    .main {
      padding: 22px;
    }

    .badge {
      display: inline-block;
      font-size: 0.76rem;
      letter-spacing: 0.05em;
      color: #d9e7ff;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 4px 10px;
      margin-bottom: 10px;
    }

    .title {
      font-size: clamp(1.2rem, 3vw, 2rem);
      margin-bottom: 8px;
    }

    .desc {
      color: var(--muted);
      line-height: 1.7;
      margin-bottom: 16px;
      font-size: 0.95rem;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 16px;
    }

    .panel {
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px;
      background: rgba(255, 255, 255, 0.02);
    }

    .panel h3 {
      font-size: 0.95rem;
      margin-bottom: 8px;
    }

    .panel ul { padding-left: 16px; color: #d7e3ff; line-height: 1.7; font-size: 0.9rem; }

    .tasks {
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px;
      margin: 14px 0 18px;
      background: rgba(77, 226, 197, 0.06);
    }

    .tasks h4 { font-size: 0.92rem; margin-bottom: 8px; }
    .task { display: flex; gap: 8px; align-items: start; margin-bottom: 7px; font-size: 0.9rem; color: #dce8ff; }

    .hint {
      border-left: 3px solid var(--warn);
      background: rgba(255, 209, 102, 0.08);
      padding: 10px 12px;
      border-radius: 8px;
      color: #ffe5ad;
      font-size: 0.88rem;
      margin-bottom: 16px;
    }

    .nav {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
    }

    button {
      border: 1px solid var(--line);
      border-radius: 10px;
      background: rgba(255,255,255,0.04);
      color: #dbe6ff;
      padding: 9px 14px;
      cursor: pointer;
      font-size: 0.9rem;
    }

    button.primary { background: linear-gradient(90deg, var(--brand), var(--brand-2)); color: #081321; border: none; font-weight: 700; }
    button:disabled { opacity: 0.4; cursor: not-allowed; }

    @media (max-width: 900px) {
      .shell { grid-template-columns: 1fr; }
      .sidebar { position: static; }
      .grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <aside class="sidebar card">
      <h1>本地知识库引导工坊</h1>
      <p class="subtitle">目标：让新手通过“边看边做”掌握 <b>Obsidian + OpenCL Aw</b> 的完整工作流。</p>

      <div class="progress-wrap">
        <div class="progress-label"><span>完成进度</span><span id="percent">0%</span></div>
        <div class="progress"><i id="bar"></i></div>
      </div>

      <ul class="steps" id="stepList"></ul>
    </aside>

    <main class="main card">
      <span class="badge" id="stepIndex">STEP 1</span>
      <h2 class="title" id="stepTitle"></h2>
      <p class="desc" id="stepDesc"></p>

      <div class="grid">
        <section class="panel">
          <h3>你将学到</h3>
          <ul id="learnList"></ul>
        </section>
        <section class="panel">
          <h3>实操结果</h3>
          <ul id="resultList"></ul>
        </section>
      </div>

      <section class="tasks">
        <h4>请完成以下试做（都完成后才可下一步）</h4>
        <div id="taskList"></div>
      </section>

      <div class="hint" id="hintBox"></div>

      <div class="nav">
        <button id="prevBtn">上一步</button>
        <button class="primary" id="nextBtn">完成并继续</button>
      </div>
    </main>
  </div>

  <script>
    const steps = [
      {
        title: "初始化：搭好本地知识库骨架",
        desc: "创建 Vault、规划目录结构，并准备模板，让后续 OpenCL Aw 输出能直接落盘到正确位置。",
        learn: ["创建 Obsidian Vault 与同步目录", "设计 `Inbox / Projects / Resources / Archive` 四层结构", "制作每日笔记与实验记录模板"],
        result: ["你将得到可扩展的目录规范", "后续每个功能都能按模板接入", "避免资料越积越乱"],
        tasks: ["新建一个 Vault 并命名", "创建四个核心目录", "做一个“实验日志模板”并保存"],
        hint: "提示：模板里建议至少包含“输入、命令、输出、反思”四个字段。"
      },
      {
        title: "连接：让 OpenCL Aw 能读写你的知识",
        desc: "配置 OpenCL Aw 的工作目录、权限与调用参数，确保它可以安全读取资料并生成 Markdown。",
        learn: ["绑定 OpenCL Aw 到 Vault 路径", "设置只读/可写范围与安全边界", "统一输出格式为 Markdown + YAML"],
        result: ["AI 输出可以自动进入 Obsidian", "避免误写到系统目录", "后续可进行自动化批处理"],
        tasks: ["在配置文件中写入 Vault 路径", "限制 OpenCL Aw 仅访问指定目录", "执行一次“生成测试笔记”"],
        hint: "提示：先让模型只写到 `Inbox/`，验证稳定后再开放到 `Projects/`。"
      },
      {
        title: "组织：做双向链接与标签系统",
        desc: "通过命名规则、标签体系和 MOC（Map of Content）页面，把零散信息编织成可检索的知识网络。",
        learn: ["为笔记定义标准命名", "自动插入标签与别名", "创建主题导航页（MOC）"],
        result: ["任何概念都能追踪来源", "形成“主题-子主题-原文”层级", "检索效率显著提升"],
        tasks: ["创建一个 MOC 页面", "给 3 篇笔记添加统一标签", "添加至少 5 个双向链接"],
        hint: "提示：标签建议“领域/粒度/状态”三段式，例如 `#ai/agent/draft`。"
      },
      {
        title: "自动化：一键导入、总结与复盘",
        desc: "构建引导式按钮流程：采集资料 → AI 摘要 → 关联到项目页 → 生成复盘。",
        learn: ["设计“输入-处理-输出”流水线", "让 OpenCL Aw 自动生成摘要和行动项", "在 Obsidian 中形成可回放的操作历史"],
        result: ["每次学习都有标准落地记录", "复盘可追踪每一步产出", "新成员可以照着流程快速上手"],
        tasks: ["导入一段外部资料", "让 OpenCL Aw 生成结构化摘要", "把摘要链接到项目主页面"],
        hint: "提示：给每次自动化任务加唯一 ID，方便回溯与排错。"
      },
      {
        title: "发布：建立新人可复用的“教学模式”",
        desc: "把你的流程变成可重复的引导界面：欢迎页、功能演示、闯关式检查点、完成证明。",
        learn: ["设计 onboarding 文案与节奏", "把每个能力拆成可验证关卡", "输出“学完可做什么”的成果页"],
        result: ["你的系统可被他人直接学习", "显著降低教学成本", "形成团队统一知识库标准"],
        tasks: ["写一段欢迎文案", "为 3 个关键功能设置检查点", "创建“毕业页面”并列出下一步计划"],
        hint: "提示：每个关卡只验证一个能力，能大幅减少学习挫败感。"
      }
    ];

    const done = new Set();
    let current = 0;

    const stepList = document.getElementById('stepList');
    const stepIndex = document.getElementById('stepIndex');
    const stepTitle = document.getElementById('stepTitle');
    const stepDesc = document.getElementById('stepDesc');
    const learnList = document.getElementById('learnList');
    const resultList = document.getElementById('resultList');
    const taskList = document.getElementById('taskList');
    const hintBox = document.getElementById('hintBox');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const bar = document.getElementById('bar');
    const percent = document.getElementById('percent');

    function renderSidebar() {
      stepList.innerHTML = '';
      steps.forEach((s, i) => {
        const li = document.createElement('li');
        li.className = 'step-item' + (i === current ? ' active' : '') + (done.has(i) ? ' done' : '');
        li.textContent = `步骤 ${i + 1} · ${s.title}`;
        li.addEventListener('click', () => {
          if (i <= Math.max(...done, 0) + 1 || done.has(i)) {
            current = i;
            render();
          }
        });
        stepList.appendChild(li);
      });

      const progress = Math.round((done.size / steps.length) * 100);
      bar.style.width = progress + '%';
      percent.textContent = progress + '%';
    }

    function fillList(target, arr) {
      target.innerHTML = '';
      arr.forEach(item => {
        const li = document.createElement('li');
        li.textContent = item;
        target.appendChild(li);
      });
    }

    function renderTasks(items) {
      taskList.innerHTML = '';
      items.forEach((item, idx) => {
        const id = `task-${current}-${idx}`;
        const row = document.createElement('label');
        row.className = 'task';
        row.innerHTML = `<input type="checkbox" id="${id}" /> <span>${item}</span>`;
        taskList.appendChild(row);
      });
      refreshNextState();
      taskList.querySelectorAll('input').forEach(box => box.addEventListener('change', refreshNextState));
    }

    function refreshNextState() {
      const inputs = [...taskList.querySelectorAll('input')];
      const allDone = inputs.length && inputs.every(i => i.checked);
      nextBtn.disabled = !allDone;
    }

    function render() {
      const s = steps[current];
      stepIndex.textContent = `STEP ${current + 1}`;
      stepTitle.textContent = s.title;
      stepDesc.textContent = s.desc;
      fillList(learnList, s.learn);
      fillList(resultList, s.result);
      renderTasks(s.tasks);
      hintBox.textContent = s.hint;

      prevBtn.disabled = current === 0;
      nextBtn.textContent = current === steps.length - 1 ? '完成引导' : '完成并继续';
      renderSidebar();
    }

    prevBtn.addEventListener('click', () => {
      if (current > 0) {
        current--;
        render();
      }
    });

    nextBtn.addEventListener('click', () => {
      done.add(current);
      if (current < steps.length - 1) {
        current++;
        render();
      } else {
        alert('🎉 恭喜！你已完成 Obsidian × OpenCL Aw 的教学引导流程。');
        renderSidebar();
      }
    });

    render();
  </script>
</body>
</html>
