<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Signal Board</title>
    <style>
:root {
  --bg: #f6f6f2;
  --surface: #ffffff;
  --surface-soft: #fbfaf7;
  --ink: #171717;
  --muted: #66645f;
  --line: #d9d6ce;
  --accent: #126a73;
  --accent-warm: #b55231;
  --good: #1f7a4d;
  --warn: #9a6700;
  --bad: #b42318;
  --radius: 8px;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  min-height: 100%;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", "Microsoft YaHei", sans-serif;
  color: var(--ink);
  background: var(--bg);
}

button, input, select { font: inherit; }
button { cursor: pointer; }

.shell {
  max-width: 1120px;
  margin: 0 auto;
  padding: 26px 18px 48px;
}

.hero {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 18px;
  padding-bottom: 18px;
  border-bottom: 1px solid var(--line);
}

.hero-main { min-width: 0; }

.hero-headline {
  display: flex;
  gap: 14px;
  align-items: center;
}

.hero-headline > div { min-width: 0; }

.hero-logo {
  width: 56px;
  height: 56px;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--surface);
}

.hero-tag {
  margin: 0;
  font-size: 12px;
  letter-spacing: 0;
  color: var(--muted);
}

.hero h1 {
  margin: 6px 0 0;
  font-size: 36px;
  line-height: 1.08;
  overflow-wrap: break-word;
}

.hero-sub {
  margin: 12px 0 0;
  color: var(--muted);
  font-size: 15px;
  line-height: 1.6;
}

.hero-meta {
  align-self: start;
  display: grid;
  gap: 4px;
  min-width: 156px;
  padding: 10px 12px;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--surface);
}

.updated-label { color: var(--muted); font-size: 12px; }
.updated { color: var(--ink); font-size: 13px; font-weight: 700; }

.stats {
  grid-column: 1 / -1;
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 10px;
}

.stat {
  border: 1px solid var(--line);
  background: var(--surface);
  border-radius: var(--radius);
  padding: 11px 12px;
}

.stat .k { font-size: 12px; color: var(--muted); }
.stat .v { margin-top: 4px; font-size: 23px; font-weight: 700; }

.coverage-strip {
  grid-column: 1 / -1;
  display: grid;
  grid-template-columns: repeat(6, minmax(0, 1fr));
  gap: 8px;
}

.coverage-card {
  min-width: 0;
  display: grid;
  gap: 4px;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 10px 11px;
  background: var(--surface-soft);
}

.coverage-card strong {
  min-width: 0;
  color: var(--ink);
  font-size: 17px;
  line-height: 1.15;
  overflow-wrap: anywhere;
}

.coverage-label, .coverage-meta {
  min-width: 0;
  color: var(--muted);
  font-size: 11px;
  line-height: 1.3;
  overflow-wrap: anywhere;
}

.coverage-card.ok strong { color: var(--good); }
.coverage-card.warn strong { color: var(--warn); }
.coverage-card.signal { border-color: rgba(18,106,115,.3); }
.coverage-card.official { border-color: rgba(31,122,77,.28); }
.coverage-card.builders { border-color: rgba(181,82,49,.32); }
.coverage-card.aggregate { border-color: rgba(102,100,95,.32); }
.coverage-card.private { border-color: rgba(154,103,0,.3); }

.primary-controls {
  margin-top: 16px;
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 12px;
  align-items: center;
}

input, select {
  width: 100%;
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--ink);
  border-radius: var(--radius);
  padding: 11px 12px;
  font-size: 14px;
}

input:focus, select:focus, button:focus-visible, summary:focus-visible {
  outline: 2px solid rgba(18,106,115,.35);
  outline-offset: 2px;
}

.mode-hint { color: var(--muted); font-size: 13px; white-space: nowrap; }

.advanced-panel {
  margin-top: 12px;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--surface);
}

.advanced-panel summary {
  position: relative;
  display: flex;
  justify-content: space-between;
  gap: 12px;
  align-items: center;
  padding: 12px 14px 12px 42px;
  color: var(--ink);
  font-size: 14px;
  font-weight: 700;
  list-style: none;
  cursor: pointer;
}

.advanced-panel summary::-webkit-details-marker { display: none; }

.advanced-panel summary::before {
  content: "+";
  width: 18px;
  height: 18px;
  position: absolute;
  left: 14px;
  top: 50%;
  transform: translateY(-50%);
  display: grid;
  place-items: center;
  border: 1px solid var(--line);
  border-radius: 50%;
  color: var(--muted);
  font-weight: 700;
}

.advanced-panel summary > span:first-child { min-width: 0; }
.advanced-panel[open] summary::before { content: "-"; }

.advanced-summary {
  color: var(--muted);
  font-size: 12px;
  font-weight: 400;
  white-space: nowrap;
}

.advanced-content {
  display: grid;
  gap: 12px;
  padding: 0 14px 14px;
  border-top: 1px solid var(--line);
}

.advanced-controls {
  display: grid;
  grid-template-columns: minmax(180px, .8fr) auto auto;
  gap: 10px;
  align-items: end;
  padding-top: 14px;
}

.field {
  display: grid;
  gap: 6px;
  color: var(--muted);
  font-size: 12px;
}

.mode-switch {
  display: inline-flex;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  overflow: hidden;
  background: var(--surface-soft);
}

.mode-btn {
  min-height: 40px;
  border: 0;
  border-left: 1px solid var(--line);
  background: transparent;
  color: var(--muted);
  padding: 0 13px;
  font-size: 13px;
}

.mode-btn:first-child { border-left: 0; }
.mode-btn.active { background: var(--accent); color: #fff; font-weight: 700; }

.all-dedupe {
  display: none;
  min-height: 40px;
  align-items: center;
  gap: 8px;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 0 12px;
  font-size: 13px;
  color: var(--muted);
  background: var(--surface-soft);
  cursor: pointer;
  user-select: none;
}

.all-dedupe.show { display: inline-flex; }

.all-dedupe input {
  position: absolute;
  opacity: 0;
  width: 0;
  height: 0;
}

.all-dedupe-dot {
  width: 12px;
  height: 12px;
  border-radius: 50%;
  border: 1px solid rgba(23,23,23,.25);
  background: rgba(23,23,23,.16);
}

.all-dedupe input:checked + .all-dedupe-dot {
  border-color: rgba(18,106,115,.65);
  background: var(--accent);
}

.source-health { display: grid; gap: 10px; }

.health-grid {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 8px;
}

.health-metric {
  display: grid;
  gap: 3px;
  min-width: 0;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 9px 10px;
  background: var(--surface-soft);
}

.health-metric strong { font-size: 18px; }
.health-label { color: var(--muted); font-size: 12px; }
.health-metric.ok strong { color: var(--good); }
.health-metric.warn strong { color: var(--warn); }
.health-metric.bad strong { color: var(--bad); }

.health-empty, .health-ok {
  border: 1px dashed var(--line);
  border-radius: var(--radius);
  padding: 10px 12px;
  color: var(--muted);
  font-size: 13px;
}

.health-ok {
  color: var(--good);
  border-style: solid;
  background: rgba(31,122,77,.06);
}

.health-issues { display: grid; gap: 8px; }

.health-issue {
  border: 1px solid rgba(180,35,24,.22);
  border-radius: var(--radius);
  padding: 10px 12px;
  background: rgba(180,35,24,.04);
}

.health-issue-title { color: var(--bad); font-size: 13px; font-weight: 700; }

.health-issue ul {
  margin: 7px 0 0;
  padding-left: 18px;
  color: var(--muted);
  font-size: 12px;
  line-height: 1.45;
}

.site-pills { display: flex; flex-wrap: wrap; gap: 8px; }

.pill {
  border: 1px solid var(--line);
  background: var(--surface-soft);
  color: var(--ink);
  border-radius: 999px;
  padding: 6px 11px;
  cursor: pointer;
  font-size: 12px;
}

.pill.active {
  background: rgba(18,106,115,.11);
  border-color: rgba(18,106,115,.5);
  color: var(--accent);
  font-weight: 700;
}

.list-wrap, .waytoagi-wrap {
  margin-top: 16px;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--surface);
  overflow: hidden;
}

.list-head, .waytoagi-head {
  padding: 14px 16px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  border-bottom: 1px solid var(--line);
  background: var(--surface-soft);
}

.list-head h2, .waytoagi-head h2 { margin: 0; font-size: 20px; }
#resultCount, #waytoagiUpdatedAt { color: var(--muted); font-size: 13px; white-space: nowrap; }

.news-list, .site-group-list, .source-group-list { display: grid; }

.site-group {
  min-width: 0;
  border-top: 1px solid rgba(23,23,23,.08);
}

.site-group:first-child { border-top: 0; }

.site-group-head, .source-group-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  padding: 12px 16px;
  border-bottom: 1px solid rgba(23,23,23,.08);
}

.site-group-head { background: rgba(18,106,115,.06); }
.source-group-head { background: rgba(181,82,49,.05); }
.site-group-head h3, .source-group-head h3 { margin: 0; min-width: 0; }
.site-group-head h3 { font-size: 16px; }
.source-group-head h3 { font-size: 14px; }

.site-group-head span, .source-group-head span {
  color: var(--muted);
  font-size: 12px;
  white-space: nowrap;
}

.source-group {
  min-width: 0;
  border-top: 1px solid rgba(23,23,23,.06);
}

.source-group:first-child { border-top: 0; }

.news-card {
  min-width: 0;
  padding: 13px 16px;
  border-top: 1px solid rgba(23,23,23,.08);
}

.news-card:first-child { border-top: 0; }

.meta-row {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  align-items: center;
  color: var(--muted);
  font-size: 12px;
}

.site { font-weight: 700; color: #3f3d39; }

.category, .source {
  padding: 2px 7px;
  border: 1px solid var(--line);
  border-radius: 999px;
  font-size: 11px;
}

.category { color: var(--ink); background: var(--surface-soft); }
.category.kind-official { border-color: rgba(31,122,77,.34); color: var(--good); }
.category.kind-newsletter { border-color: rgba(154,103,0,.34); color: var(--warn); }
.category.kind-builders { border-color: rgba(181,82,49,.36); color: var(--accent-warm); }
.category.kind-aggregate, .category.kind-blogs, .category.kind-aihub { color: var(--muted); }

.time { margin-left: auto; }

.title {
  min-width: 0;
  margin-top: 8px;
  display: inline-flex;
  flex-direction: column;
  gap: 3px;
  color: var(--ink);
  text-decoration: none;
  font-size: 16px;
  line-height: 1.42;
  overflow-wrap: anywhere;
}

.title-sub { color: var(--muted); font-size: 12px; line-height: 1.35; font-weight: 400; }
.title:hover { color: var(--accent); }

.empty { padding: 24px 16px; color: var(--muted); text-align: center; }

.waytoagi-tools { display: inline-flex; align-items: center; gap: 10px; }

.waytoagi-switch {
  display: inline-flex;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  overflow: hidden;
  background: var(--surface);
}

.waytoagi-btn {
  min-height: 32px;
  border: 0;
  border-left: 1px solid var(--line);
  background: transparent;
  color: var(--muted);
  padding: 0 10px;
  font-size: 12px;
}

.waytoagi-btn:first-child { border-left: 0; }
.waytoagi-btn.active { background: var(--accent); color: #fff; font-weight: 700; }

.waytoagi-meta {
  padding: 12px 16px 0;
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  font-size: 12px;
  color: var(--muted);
}

.waytoagi-meta a { color: var(--accent); text-decoration: none; }

.waytoagi-list { padding: 12px 16px 16px; display: grid; gap: 8px; }

.waytoagi-item {
  min-width: 0;
  display: grid;
  grid-template-columns: 76px minmax(0, 1fr);
  gap: 8px;
  text-decoration: none;
  border: 1px solid rgba(23,23,23,.08);
  border-radius: var(--radius);
  padding: 8px 10px;
  color: var(--ink);
  background: var(--surface-soft);
}

.waytoagi-item .d { color: var(--muted); font-size: 12px; }
.waytoagi-item .t { min-width: 0; font-size: 13px; line-height: 1.35; overflow-wrap: anywhere; }

.waytoagi-empty, .waytoagi-error {
  border-radius: var(--radius);
  padding: 9px 10px;
  font-size: 13px;
}

.waytoagi-empty { border: 1px dashed var(--line); color: var(--muted); }
.waytoagi-error { border: 1px solid rgba(180,35,24,.28); background: rgba(180,35,24,.08); color: var(--bad); }

@media (max-width: 760px) {
  .shell { padding: 18px 12px 36px; }
  .hero, .primary-controls, .advanced-controls, .waytoagi-head { grid-template-columns: 1fr; }
  .advanced-panel summary { align-items: flex-start; flex-direction: column; }
  .hero h1 { font-size: 28px; }
  .hero-logo { width: 50px; height: 50px; }
  .hero-meta { min-width: 0; }
  .stats, .coverage-strip, .health-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .mode-hint, .advanced-summary, #resultCount, #waytoagiUpdatedAt { white-space: normal; }
  .time { margin-left: 0; }
  .waytoagi-head { align-items: flex-start; flex-direction: column; }
}

@media (max-width: 460px) {
  .hero-headline { align-items: flex-start; }
  .stats, .coverage-strip, .health-grid { grid-template-columns: 1fr; }
  .waytoagi-tools { align-items: flex-start; flex-direction: column; }
}
    </style>

      <section class="waytoagi-wrap">

          <div class="waytoagi-tools">
            <div class="waytoagi-switch">
              <button id="waytoagiTodayBtn" class="waytoagi-btn active" type="button">最近更新日</button>

        <div id="waytoagiMeta" class="waytoagi-meta"></div>
        <div id="waytoagiList" class="waytoagi-list"></div>

      <section class="list-wrap">

        <div id="newsList" class="news-list"></div>
      </section>
    </main>

function fmt(n) { return new Intl.NumberFormat('zh-CN').format(n || 0); }

function fmtTime(iso) {
  if (!iso) return '时间未知';
  const d = new Date(iso);
  if (isNaN(d)) return '时间未知';
  return new Intl.DateTimeFormat('zh-CN', { month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit' }).format(d);
}

function fmtDate(iso) {
  if (!iso) return '未知日期';
  const d = new Date(`${iso}T00:00:00`);
  if (isNaN(d)) return iso;
  return new Intl.DateTimeFormat('zh-CN', { month:'2-digit', day:'2-digit' }).format(d);
}

function sourceKind(siteId) {
  return SOURCE_KINDS[siteId] || { label: '来源', tone: 'default' };
}

function siteRows() {
  return Array.isArray(state.sourceStatus?.sites) ? state.sourceStatus.sites : [];
}

function siteRow(siteId) {
  return siteRows().find(s => s.site_id === siteId) || null;
}

function setStats(payload) {
  const cards = [
    ['AI 信号', fmt(payload.total_items)],
    ['站点数',  fmt(payload.site_count)],
    ['来源分组', fmt(payload.source_count)],
    ['归档',    fmt(payload.archive_total || 0)],
  ];
  statsEl.innerHTML = '';
  cards.forEach(([k, v]) => {
    const node = document.createElement('div');
    node.className = 'stat';
    node.innerHTML = `<div class="k">${k}</div><div class="v">${v}</div>`;
    statsEl.appendChild(node);
  });
}

function mkCoverageCard(label, value, meta, tone = '') {
  const node = document.createElement('div');
  node.className = `coverage-card ${tone}`.trim();
  node.innerHTML = `<span class="coverage-label">${label}</span><strong>${value}</strong><span class="coverage-meta">${meta}</span>`;
  return node;
}

  const sites = Array.isArray(status.sites) ? status.sites : [];
  advancedSummaryEl.textContent = `${fmt(status.successful_sites || 0)}/${fmt(sites.length)} 源可用 · 全量 ${fmt(allCount)} 条`;
}

function computeSiteStats(items) {
  const m = new Map();
  items.forEach(item => {
    if (!m.has(item.site_id)) m.set(item.site_id, { site_id: item.site_id, site_name: item.site_name, count: 0, raw_count: 0 });
    const r = m.get(item.site_id);
    r.count++;
    r.raw_count++;
  });
  return [...m.values()].sort((a, b) => b.count - a.count || a.site_name.localeCompare(b.site_name, 'zh-CN'));
}

function currentSiteStats() {
  if (state.mode === 'ai') return state.statsAi || [];
  return computeSiteStats(state.allDedup ? state.itemsAll : state.itemsAllRaw);
}

function renderSiteFilters() {
  const stats = currentSiteStats();

  siteSelectEl.innerHTML = '<option value="">全部站点</option>';
  stats.forEach(s => {
    const opt = document.createElement('option');
    opt.value = s.site_id;
    opt.textContent = `${s.site_name} (${s.count}/${s.raw_count ?? s.count})`;
    siteSelectEl.appendChild(opt);
  });
  siteSelectEl.value = state.siteFilter;

  sitePillsEl.innerHTML = '';
  const allPill = document.createElement('button');
  allPill.className = `pill ${state.siteFilter === '' ? 'active' : ''}`;
  allPill.textContent = '全部';
  allPill.onclick = () => { state.siteFilter = ''; renderSiteFilters(); renderList(); };
  sitePillsEl.appendChild(allPill);

  stats.forEach(s => {
    const btn = document.createElement('button');
    btn.className = `pill ${state.siteFilter === s.site_id ? 'active' : ''}`;
    btn.textContent = `${s.site_name} ${s.count}/${s.raw_count ?? s.count}`;
    btn.onclick = () => { state.siteFilter = s.site_id; renderSiteFilters(); renderList(); };
    sitePillsEl.appendChild(btn);
  });
}

    modeHintEl.textContent = `AI强相关 · ${fmt(state.totalAi)} 条`;
    if (listTitleEl) listTitleEl.textContent = 'AI 信号流';

    const cnt = state.allDedup ? (state.totalAllMode || state.itemsAll.length) : (state.totalRaw || state.itemsAllRaw.length);
    modeHintEl.textContent = `全量 · ${state.allDedup ? '去重开' : '去重关'} · ${fmt(cnt)} 条`;
    if (listTitleEl) listTitleEl.textContent = '全量更新';
  }
  renderAdvancedSummary();
}

function effectiveAllItems() {
  return state.allDedup ? state.itemsAll : state.itemsAllRaw;
}

function modeItems() {
  return state.mode === 'all' ? effectiveAllItems() : state.itemsAi;
}

function getFilteredItems() {
  const q = state.query.trim().toLowerCase();
  return modeItems().filter(item => {
    if (state.siteFilter && item.site_id !== state.siteFilter) return false;
    if (!q) return true;
    const hay = `${item.title || ''} ${item.title_zh || ''} ${item.title_en || ''} ${item.site_name || ''} ${item.source || ''}`.toLowerCase();
    return hay.includes(q);
  });
}

function renderItemNode(item) {
  const node = itemTpl.content.firstElementChild.cloneNode(true);
  node.querySelector('.site').textContent = item.site_name;
  const kind = sourceKind(item.site_id);
  const categoryEl = node.querySelector('.category');
  categoryEl.textContent = kind.label;
  categoryEl.classList.add(`kind-${kind.tone}`);
  node.querySelector('.source').textContent = `分区: ${item.source}`;
  node.querySelector('.time').textContent = fmtTime(item.published_at || item.first_seen_at);

  const titleEl = node.querySelector('.title');
  const zh = (item.title_zh || '').trim();
  const en = (item.title_en || '').trim();
  titleEl.textContent = '';
  if (zh && en && zh !== en) {
    const primary = document.createElement('span');
    primary.textContent = zh;
    const sub = document.createElement('span');
    sub.className = 'title-sub';
    sub.textContent = en;
    titleEl.append(primary, sub);
  } else {
    titleEl.textContent = item.title || zh || en;
  }
  titleEl.href = item.url;
  return node;
}

function buildSourceGroupNode(source, items) {
  const section = document.createElement('section');
  section.className = 'source-group';
  const header = document.createElement('header');
  header.className = 'source-group-head';
  const title = document.createElement('h3');
  title.textContent = source;
  const count = document.createElement('span');
  count.textContent = `${fmt(items.length)} 条`;
  const listEl = document.createElement('div');
  listEl.className = 'source-group-list';
  header.append(title, count);
  section.append(header, listEl);
  items.forEach(item => listEl.appendChild(renderItemNode(item)));
  return section;
}

function groupBySource(items) {
  const m = new Map();
  items.forEach(item => {
    const key = item.source || '未分区';
    if (!m.has(key)) m.set(key, []);
    m.get(key).push(item);
  });
  return [...m.entries()].sort((a, b) => b[1].length - a[1].length || a[0].localeCompare(b[0], 'zh-CN'));
}

function renderGroupedBySource(items) {
  const frag = document.createDocumentFragment();
  groupBySource(items).forEach(([source, groupItems]) => frag.appendChild(buildSourceGroupNode(source, groupItems)));
  newsListEl.appendChild(frag);
}

function renderGroupedBySiteAndSource(items) {
  const siteMap = new Map();
  items.forEach(item => {
    if (!siteMap.has(item.site_id)) siteMap.set(item.site_id, { siteName: item.site_name || item.site_id, items: [] });
    siteMap.get(item.site_id).items.push(item);
  });

  const sites = [...siteMap.entries()].sort((a, b) => {
    const byCount = b[1].items.length - a[1].items.length;
    if (byCount !== 0) return byCount;
    return a[1].siteName.localeCompare(b[1].siteName, 'zh-CN');
  });

  const frag = document.createDocumentFragment();
  sites.forEach(([, site]) => {
    const siteSection = document.createElement('section');
    siteSection.className = 'site-group';
    const header = document.createElement('header');
    header.className = 'site-group-head';
    const title = document.createElement('h3');
    title.textContent = site.siteName;
    const count = document.createElement('span');
    count.textContent = `${fmt(site.items.length)} 条`;
    const siteListEl = document.createElement('div');
    siteListEl.className = 'site-group-list';
    header.append(title, count);
    siteSection.append(header, siteListEl);
    groupBySource(site.items).forEach(([source, groupItems]) => siteListEl.appendChild(buildSourceGroupNode(source, groupItems)));
    frag.appendChild(siteSection);
  });
  newsListEl.appendChild(frag);
}

function renderList() {
  const filtered = getFilteredItems();
  resultCountEl.textContent = `${fmt(filtered.length)} 条`;
  newsListEl.innerHTML = '';
  if (!filtered.length) {
    const empty = document.createElement('div');
    empty.className = 'empty';
    empty.textContent = '当前筛选条件下没有结果。';
    newsListEl.appendChild(empty);
    return;
  }
  if (state.siteFilter) {
    renderGroupedBySource(filtered);
  } else {
    renderGroupedBySiteAndSource(filtered);
  }
}

function waytoagiViews(wta) {
  const updates7d = Array.isArray(wta?.updates_7d) ? wta.updates_7d : [];
  const latestDate = wta?.latest_date || (updates7d.length ? updates7d[0].date : null);
  const updatesToday = Array.isArray(wta?.updates_today) && wta.updates_today.length
    ? wta.updates_today
    : (latestDate ? updates7d.filter(u => u.date === latestDate) : []);
  return { updates7d, updatesToday, latestDate };
}

function renderWaytoagi(wta) {
  const { updates7d, updatesToday, latestDate } = waytoagiViews(wta);
  waytoagiTodayBtnEl.classList.toggle('active', state.waytoagiMode === 'today');
  waytoagi7dBtnEl.classList.toggle('active', state.waytoagiMode === '7d');
  waytoagiUpdatedAtEl.textContent = `更新时间：${fmtTime(wta.generated_at)}`;

  waytoagiMetaEl.innerHTML = '';
  const parts = [
    Object.assign(document.createElement('a'), { href: wta.root_url || '#', target:'_blank', rel:'noopener noreferrer', textContent:'主页面' }),
    '·',
    Object.assign(document.createElement('a'), { href: wta.history_url || '#', target:'_blank', rel:'noopener noreferrer', textContent:'历史更新页' }),
    '·',
    Object.assign(document.createElement('span'), { textContent: `最近更新日(${latestDate || '--'})：${fmt(wta.count_today || updatesToday.length)} 条` }),
    '·',
    Object.assign(document.createElement('span'), { textContent: `近 7 日：${fmt(wta.count_7d || updates7d.length)} 条` }),
  ];
  parts.forEach(p => {
    if (typeof p === 'string') {
      const sep = document.createElement('span');
      sep.textContent = p;
      waytoagiMetaEl.appendChild(sep);
    } else {
      waytoagiMetaEl.appendChild(p);
    }
  });

  waytoagiListEl.innerHTML = '';
  const updates = state.waytoagiMode === 'today' ? updatesToday : updates7d;
  if (!updates.length) {
    const div = document.createElement('div');
    div.className = 'waytoagi-empty';
    div.textContent = state.waytoagiMode === 'today' ? '最近更新日没有更新，可切换到近7日查看。' : '近 7 日没有更新';
    waytoagiListEl.appendChild(div);
    return;
  }
  updates.forEach(u => {
    const row = document.createElement('a');
    row.className = 'waytoagi-item';
    row.href = u.url || '#';
    row.target = '_blank';
    row.rel = 'noopener noreferrer';
    row.innerHTML = `<span class="d">${fmtDate(u.date)}</span><span class="t">${u.title}</span>`;
    waytoagiListEl.appendChild(row);
  });
}

function mkMetric(label, value, tone = '') {
  const node = document.createElement('div');
  node.className = `health-metric ${tone}`.trim();
  node.innerHTML = `<span class="health-label">${label}</span><strong>${value}</strong>`;
  return node;
}

function renderSourceHealth() {
  if (!sourceHealthEl) return;
  sourceHealthEl.innerHTML = '';
  const status = state.sourceStatus;
  if (!status) {
    sourceHealthEl.innerHTML = '<div class="health-empty">源状态未生成</div>';
    renderAdvancedSummary();
    return;
  }
  const sites     = Array.isArray(status.sites)        ? status.sites        : [];
  const failed    = Array.isArray(status.failed_sites)  ? status.failed_sites  : [];
  const zero      = Array.isArray(status.zero_item_sites)? status.zero_item_sites: [];
  const rss       = status.rss_opml || {};
  const failedFeeds    = Array.isArray(rss.failed_feeds)   ? rss.failed_feeds   : [];
  const skippedFeeds   = Array.isArray(rss.skipped_feeds)  ? rss.skipped_feeds  : [];
  const replacedFeeds  = Array.isArray(rss.replaced_feeds) ? rss.replaced_feeds : [];

  const grid = document.createElement('div');
  grid.className = 'health-grid';
  grid.append(
    mkMetric('内置源', `${fmt(status.successful_sites || 0)}/${fmt(sites.length)}`, failed.length ? 'warn' : 'ok'),
    mkMetric('RSS', rss.enabled ? `${fmt(rss.ok_feeds || 0)}/${fmt(rss.effective_feed_total || 0)}` : '未启用'),
    mkMetric('失败源', fmt(failed.length + failedFeeds.length), failed.length || failedFeeds.length ? 'bad' : 'ok'),
    mkMetric('替换/跳过', `${fmt(replacedFeeds.length)}/${fmt(skippedFeeds.length)}`),
  );
  sourceHealthEl.appendChild(grid);

  const issues = document.createElement('div');
  issues.className = 'health-issues';

  function mkIssueList(title, items) {
    const wrap = document.createElement('div');
    wrap.className = 'health-issue';
    const titleEl = document.createElement('div');
    titleEl.className = 'health-issue-title';
    titleEl.textContent = title;
    const list = document.createElement('ul');
    items.slice(0, 6).forEach(item => {
      const li = document.createElement('li');
      li.textContent = typeof item === 'string' ? item : JSON.stringify(item);
      list.appendChild(li);
    });
    if (items.length > 6) {
      const li = document.createElement('li');
      li.textContent = `另有 ${fmt(items.length - 6)} 项`;
      list.appendChild(li);
    }
    wrap.append(titleEl, list);
    return wrap;
  }

  if (failed.length)      issues.appendChild(mkIssueList('失败站点', failed));
  if (zero.length)        issues.appendChild(mkIssueList('零结果站点', zero));
  if (failedFeeds.length) issues.appendChild(mkIssueList('失败 RSS', failedFeeds));

  if (issues.childElementCount) {
    sourceHealthEl.appendChild(issues);
  } else {
    const ok = document.createElement('div');
    ok.className = 'health-ok';
    ok.textContent = '源状态正常';
    sourceHealthEl.appendChild(ok);
  }
  renderAdvancedSummary();
}

function init() {
  const payload  = MOCK_NEWS;
  const wta      = MOCK_WAYTOAGI;
  const status   = MOCK_STATUS;

  state.itemsAi       = payload.items_ai || [];
  state.itemsAll      = payload.items_ai || [];
  state.itemsAllRaw   = payload.items_ai || [];
  state.statsAi       = payload.site_stats || [];
  state.totalAi       = payload.total_items || state.itemsAi.length;
  state.totalRaw      = payload.total_items || state.itemsAi.length;
  state.totalAllMode  = payload.total_items || state.itemsAi.length;
  state.generatedAt   = payload.generated_at;
  state.waytoagiData  = wta;
  state.sourceStatus  = status;

  setStats(payload);
  renderModeSwitch();
  renderCoverageStrip();
  renderSiteFilters();
  renderList();
  updatedAtEl.textContent = `更新时间：${fmtTime(state.generatedAt)}`;
  renderSourceHealth();
  renderWaytoagi(wta);
}

/* ── Event listeners ───────────────────────────────────────────────────────── */

searchInputEl.addEventListener('input', e => { state.query = e.target.value; renderList(); });

siteSelectEl.addEventListener('change', e => { state.siteFilter = e.target.value; renderSiteFilters(); renderList(); });

modeAiBtnEl.addEventListener('click', () => { state.mode = 'ai'; renderModeSwitch(); renderSiteFilters(); renderList(); });

modeAllBtnEl.addEventListener('click', () => { state.mode = 'all'; renderModeSwitch(); renderSiteFilters(); renderList(); });

if (allDedupeToggleEl) {
  allDedupeToggleEl.addEventListener('change', e => { state.allDedup = Boolean(e.target.checked); renderModeSwitch(); renderSiteFilters(); renderList(); });
}

waytoagiTodayBtnEl.addEventListener('click', () => { state.waytoagiMode = 'today'; renderWaytoagi(state.waytoagiData); });
waytoagi7dBtnEl.addEventListener('click', () => { state.waytoagiMode = '7d'; renderWaytoagi(state.waytoagiData); });

init();
    </script>
  </body>
</html>
