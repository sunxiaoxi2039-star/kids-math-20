<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>24小时AI更新雷达</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f6f6f2;
      --surface: #ffffff;
      --surface-soft: #fbfaf7;
      --ink: #171717;
      --ink-muted: #66645f;
      --accent: #126a73;
      --warm: #b55231;
      --line: #d9d6ce;
      --good: #1f7a4d;
      --warn: #9a6700;
      --bad: #b42318;
      --radius: 8px;
      --container: 1120px;
      --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC',
              'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
    }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--ink);
      font-size: 14px;
      line-height: 1.6;
      min-height: 100vh;
    }

    .container {
      max-width: var(--container);
      margin: 0 auto;
      padding: 0 20px;
    }

    /* ── Header ── */
    .site-header {
      background: var(--surface);
      border-bottom: 1px solid var(--line);
      padding: 28px 0 20px;
    }

    .header-top {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 8px;
    }

    .logo {
      width: 36px;
      height: 36px;
      color: var(--accent);
      flex-shrink: 0;
    }

    .site-title {
      font-size: 24px;
      font-weight: 700;
      color: var(--ink);
      letter-spacing: -0.02em;
    }

    .live-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 2px 9px;
      border-radius: 999px;
      background: var(--accent);
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.06em;
    }

    .live-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #fff;
      animation: pulse 1.4s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: .3; }
    }

    .site-subtitle {
      color: var(--ink-muted);
      font-size: 13px;
      margin-bottom: 16px;
      line-height: 1.5;
    }

    .header-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      font-size: 12px;
      color: var(--ink-muted);
    }

    .header-meta strong { color: var(--ink); font-weight: 700; }
    .meta-sep { color: var(--line); }

    .source-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 14px;
    }

    .source-pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 9px;
      border-radius: 999px;
      border: 1px solid var(--line);
      font-size: 11px;
      color: var(--ink-muted);
      background: var(--surface);
    }

    .pill-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--good);
      flex-shrink: 0;
    }

    .pill-dot.warn { background: var(--warn); }

    /* ── Controls bar ── */
    .controls-bar {
      background: var(--surface);
      border-bottom: 1px solid var(--line);
      padding: 10px 0;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 1px 3px rgba(0,0,0,.04);
    }

    .controls-inner {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .search-wrap {
      flex: 1;
      position: relative;
    }

    .search-icon {
      position: absolute;
      left: 10px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--ink-muted);
      pointer-events: none;
    }

    .search-input {
      width: 100%;
      padding: 8px 10px 8px 34px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      font-family: var(--font);
      font-size: 13px;
      background: var(--surface);
      color: var(--ink);
      outline: none;
      transition: border-color .15s, box-shadow .15s;
    }

    .search-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px rgba(18,106,115,.14);
    }

    .search-input::placeholder { color: var(--ink-muted); }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px;
      border-radius: var(--radius);
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--ink);
      font-family: var(--font);
      font-size: 13px;
      cursor: pointer;
      white-space: nowrap;
      transition: background .15s, border-color .15s, color .15s;
    }

    .btn:hover { background: var(--surface-soft); }
    .btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }

    /* ── Advanced panel ── */
    .adv-panel {
      background: var(--surface-soft);
      border-bottom: 1px solid var(--line);
      padding: 14px 0;
      display: none;
    }

    .adv-panel.open { display: block; }

    .adv-inner {
      display: flex;
      gap: 28px;
      flex-wrap: wrap;
      align-items: flex-start;
    }

    .adv-group { display: flex; flex-direction: column; gap: 8px; }

    .adv-label {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .09em;
      text-transform: uppercase;
      color: var(--ink-muted);
    }

    .adv-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      max-width: 600px;
    }

    .chip {
      padding: 3px 10px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: var(--surface);
      font-size: 12px;
      color: var(--ink-muted);
      cursor: pointer;
      transition: all .15s;
      user-select: none;
    }

    .chip:hover { border-color: var(--accent); color: var(--accent); }
    .chip.active { border-color: var(--accent); background: var(--accent); color: #fff; }

    .toggle-group {
      display: inline-flex;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      overflow: hidden;
    }

    .toggle-opt {
      padding: 5px 13px;
      font-size: 12px;
      cursor: pointer;
      background: var(--surface);
      color: var(--ink-muted);
      border: none;
      border-right: 1px solid var(--line);
      font-family: var(--font);
      transition: all .15s;
    }

    .toggle-opt:last-child { border-right: none; }
    .toggle-opt.active { background: var(--accent); color: #fff; }
    .toggle-opt:hover:not(.active) { background: var(--surface-soft); }

    /* ── Main layout ── */
    .main-content { padding: 24px 0 60px; }

    .content-grid {
      display: grid;
      grid-template-columns: 1fr 340px;
      gap: 24px;
      align-items: start;
    }

    /* ── Feed column ── */
    .feed-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .feed-title {
      font-size: 13px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .count-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 1px 7px;
      border-radius: 999px;
      background: var(--accent);
      color: #fff;
      font-size: 11px;
      font-weight: 700;
    }

    .sort-label {
      font-size: 11px;
      color: var(--ink-muted);
    }

    /* ── News item ── */
    .news-item {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 14px 16px;
      margin-bottom: 7px;
      transition: box-shadow .15s, border-color .15s;
    }

    .news-item:hover {
      border-color: #c5c2ba;
      box-shadow: 0 2px 8px rgba(0,0,0,.06);
    }

    .news-meta {
      display: flex;
      align-items: center;
      gap: 7px;
      margin-bottom: 7px;
      flex-wrap: wrap;
    }

    .source-badge {
      display: inline-flex;
      align-items: center;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 600;
      background: var(--surface-soft);
      border: 1px solid var(--line);
      color: var(--ink-muted);
      white-space: nowrap;
    }

    .ai-tag {
      display: inline-block;
      padding: 1px 5px;
      border-radius: 3px;
      background: rgba(18,106,115,.12);
      color: var(--accent);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .05em;
    }

    .news-time {
      font-size: 11px;
      color: var(--ink-muted);
      margin-left: auto;
      white-space: nowrap;
    }

    .news-title {
      font-size: 14px;
      font-weight: 700;
      color: var(--ink);
      line-height: 1.4;
      margin-bottom: 3px;
    }

    .news-title a {
      color: inherit;
      text-decoration: none;
    }

    .news-title a:hover { color: var(--accent); }

    .news-title-zh {
      font-size: 12.5px;
      color: var(--ink-muted);
      line-height: 1.55;
    }

    .no-results {
      text-align: center;
      padding: 48px 20px;
      color: var(--ink-muted);
      display: none;
    }

    .no-results svg { margin-bottom: 10px; color: var(--line); }

    /* ── Sidebar ── */
    .sidebar {
      position: sticky;
      top: 58px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .sidebar-card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      overflow: hidden;
    }

    .sidebar-header {
      padding: 11px 16px;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .sidebar-title {
      font-size: 13px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .s-toggle {
      display: inline-flex;
      border: 1px solid var(--line);
      border-radius: 6px;
      overflow: hidden;
    }

    .s-btn {
      padding: 3px 10px;
      font-size: 11px;
      border: none;
      border-right: 1px solid var(--line);
      background: var(--surface);
      color: var(--ink-muted);
      cursor: pointer;
      font-family: var(--font);
      transition: all .15s;
    }

    .s-btn:last-child { border-right: none; }
    .s-btn.active { background: var(--accent); color: #fff; }
    .s-btn:hover:not(.active) { background: var(--surface-soft); }

    /* WaytoAGI entries */
    .wta-item {
      padding: 11px 16px;
      border-bottom: 1px solid var(--line);
    }

    .wta-item:last-child { border-bottom: none; }

    .wta-time {
      font-size: 10px;
      color: var(--ink-muted);
      font-weight: 700;
      letter-spacing: .06em;
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    .wta-text {
      font-size: 12px;
      color: var(--ink);
      line-height: 1.55;
    }

    /* Status */
    .status-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 7px 16px;
      font-size: 12px;
      border-bottom: 1px solid var(--line);
    }

    .status-row:last-child { border-bottom: none; }

    .status-name { color: var(--ink-muted); }

    .status-right {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .status-label {
      font-size: 10px;
      font-weight: 600;
    }

    .status-label.good { color: var(--good); }
    .status-label.warn { color: var(--warn); }
    .status-label.bad { color: var(--bad); }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--good);
      flex-shrink: 0;
    }

    .status-dot.warn { background: var(--warn); }
    .status-dot.bad { background: var(--bad); }

    /* ── Footer ── */
    footer {
      border-top: 1px solid var(--line);
      background: var(--surface);
      padding: 20px 0;
      text-align: center;
      font-size: 12px;
      color: var(--ink-muted);
    }

    footer a { color: var(--accent); text-decoration: none; }
    footer a:hover { text-decoration: underline; }

    /* ── Responsive ── */
    @media (max-width: 860px) {
      .content-grid { grid-template-columns: 1fr; }
      .sidebar { position: static; }
    }

    @media (max-width: 540px) {
      .site-title { font-size: 19px; }
      .adv-inner { flex-direction: column; }
      .header-meta { gap: 6px; }
    }
  </style>
</head>

const STATUS = [
  { name: 'OpenAI Blog',       status: 'good' },
  { name: 'Anthropic News',    status: 'good' },
  { name: 'Google DeepMind',   status: 'good' },
  { name: 'Meta AI Blog',      status: 'good' },
  { name: 'Hugging Face',      status: 'good' },
  { name: 'arXiv cs.AI',       status: 'good' },
  { name: 'Mistral AI',        status: 'good' },
  { name: 'xAI Blog',          status: 'good' },
  { name: 'DeepSeek',          status: 'warn' },
  { name: 'Stability AI',      status: 'good' },
  { name: 'Cohere Blog',       status: 'good' },
  { name: 'AWS AI Blog',       status: 'good' },
];

/* ── State ─────────────────────────────────────────────────────────────────── */

const state = {
  search: '',
  site: 'all',
  mode: 'ai',
  dedup: true,
  wta: 'today',
};

/* ── Bootstrap ─────────────────────────────────────────────────────────────── */

function init() {
  document.getElementById('updateTime').textContent = fmtTime(NOW);
  document.getElementById('totalCount').textContent = NEWS.length;
  document.getElementById('aiCount').textContent = NEWS.filter(n => n.isAI).length;

  buildSourcePills();
  buildSiteChips();
  buildStatusList();

  document.getElementById('searchInput').addEventListener('input', e => {
    state.search = e.target.value.toLowerCase().trim();
    render();
  });

  renderWTA();
  render();
}

function buildSourcePills() {
  const el = document.getElementById('sourcePills');
  const sources = ['OpenAI Blog', 'Anthropic', 'Google DeepMind', 'Meta AI',
                   'xAI', 'Mistral AI', 'Hugging Face', 'arXiv AI'];
  sources.forEach(s => {
    const p = document.createElement('span');
    p.className = 'source-pill';
    p.innerHTML = `<span class="pill-dot"></span>${s}`;
    el.appendChild(p);
  });
  const more = document.createElement('span');
  more.className = 'source-pill';
  more.innerHTML = `<span class="pill-dot warn"></span>+18 更多`;
  el.appendChild(more);
}

function buildSiteChips() {
  const el = document.getElementById('siteChips');
  const sources = [...new Set(NEWS.map(n => ({ label: n.source, key: n.sourceKey }))
    .map(JSON.stringify))].map(JSON.parse)
    .sort((a, b) => a.label.localeCompare(b.label));

  sources.forEach(({ label, key }) => {
    const chip = document.createElement('span');
    chip.className = 'chip';
    chip.dataset.site = key;
    chip.textContent = label;
    chip.onclick = function () { filterSite(this); };
    el.appendChild(chip);
  });
}

function buildStatusList() {
  const el = document.getElementById('statusList');
  const labels = { good: '正常', warn: '慢速', bad: '异常' };
  STATUS.forEach(s => {
    const row = document.createElement('div');
    row.className = 'status-row';
    row.innerHTML = `
      <span class="status-name">${s.name}</span>
      <span class="status-right">
        <span class="status-label ${s.status}">${labels[s.status]}</span>
        <span class="status-dot ${s.status !== 'good' ? s.status : ''}"></span>
      </span>`;
    el.appendChild(row);
  });
}

/* ── Render ─────────────────────────────────────────────────────────────────── */

function render() {
  let items = [...NEWS];

  if (state.mode === 'ai') items = items.filter(n => n.isAI);
  if (state.site !== 'all') items = items.filter(n => n.sourceKey === state.site);

  if (state.dedup) {
    const seen = new Set();
    items = items.filter(n => {
      const key = n.sourceKey + '|' + n.title.slice(0, 32).toLowerCase();
      if (seen.has(key)) return false;
      seen.add(key);
      return true;
    });
  }

  if (state.search) {
    items = items.filter(n =>
      n.title.toLowerCase().includes(state.search) ||
      n.titleZh.includes(state.search) ||
      n.source.toLowerCase().includes(state.search)
    );
  }

  const feed = document.getElementById('newsFeed');
  feed.innerHTML = '';

  items.forEach(n => {
    const div = document.createElement('div');
    div.className = 'news-item';
    div.innerHTML = `
      <div class="news-meta">
        <span class="source-badge">${n.source}</span>
        ${n.isAI ? '<span class="ai-tag">AI</span>' : ''}
        <span class="news-time">${timeAgo(new Date(n.time))}</span>
      </div>
      <div class="news-title"><a href="${n.url}" target="_blank" rel="noopener">${n.title}</a></div>
      <div class="news-title-zh">${n.titleZh}</div>`;
    feed.appendChild(div);
  });

  document.getElementById('feedCount').textContent = items.length;
  document.getElementById('noResults').style.display = items.length === 0 ? 'block' : 'none';
}

function renderWTA() {
  const el = document.getElementById('wtaList');
  el.innerHTML = '';
  WAYTOAGI[state.wta].forEach(item => {
    const div = document.createElement('div');
    div.className = 'wta-item';
    div.innerHTML = `<div class="wta-time">${item.time}</div><div class="wta-text">${item.text}</div>`;
    el.appendChild(div);
  });
}

/* ── Control handlers ───────────────────────────────────────────────────────── */

function toggleAdv() {
  const panel = document.getElementById('advPanel');
  const btn = document.getElementById('advBtn');
  const chevron = document.getElementById('advChevron');
  const open = panel.classList.toggle('open');
  btn.classList.toggle('active', open);
  chevron.style.transform = open ? 'rotate(180deg)' : '';
}

function filterSite(el) {
  document.querySelectorAll('#siteChips .chip').forEach(c => c.classList.remove('active'));
  el.classList.add('active');
  state.site = el.dataset.site;
  render();
}

function setMode(mode) {
  state.mode = mode;
  document.getElementById('modeAI').classList.toggle('active', mode === 'ai');
  document.getElementById('modeAll').classList.toggle('active', mode === 'all');
  render();
}

function setDedup(on) {
  state.dedup = on;
  document.getElementById('dedupOn').classList.toggle('active', on);
  document.getElementById('dedupOff').classList.toggle('active', !on);
  render();
}

function setWTA(range) {
  state.wta = range;
  document.getElementById('wtaToday').classList.toggle('active', range === 'today');
  document.getElementById('wtaWeek').classList.toggle('active', range === 'week');
  renderWTA();
}

/* ── Helpers ─────────────────────────────────────────────────────────────────── */

function fmtTime(d) {
  const pad = n => String(n).padStart(2, '0');
  return `${pad(d.getUTCMonth() + 1)}-${pad(d.getUTCDate())} ${pad(d.getUTCHours())}:${pad(d.getUTCMinutes())}`;
}

function timeAgo(d) {
  const diff = Math.floor((NOW - d) / 60000);
  if (diff < 60) return `${diff}分钟前`;
  const h = Math.floor(diff / 60);
  if (h < 24) return `${h}小时前`;
  return `${Math.floor(h / 24)}天前`;
}

/* ── Boot ─────────────────────────────────────────────────────────────────── */
init();
</script>
