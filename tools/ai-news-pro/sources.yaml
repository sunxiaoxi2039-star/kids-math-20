  min_items: 8
  sources:
    # 英文
    - name: "Reuters AI"
      type: web_search
      query: "artificial intelligence site:reuters.com"
      language: en
    - name: "Bloomberg AI"
      type: web_search
      query: "AI artificial intelligence site:bloomberg.com"
      language: en
    - name: "CNBC AI"
      type: rss
      url: "https://search.cnbc.com/rs/search/combinedcms/view.xml?partnerId=wrss01&id=48727718"
      language: en
    - name: "Wall Street Journal Tech"
      type: web_search
      query: "artificial intelligence site:wsj.com"
      language: en
    - name: "New York Times AI"
      type: web_search
      query: "artificial intelligence site:nytimes.com"
      language: en
    - name: "Financial Times AI"
      type: web_search
      query: "AI artificial intelligence site:ft.com"
      language: en
    # 中文
    - name: "新华社 AI"
      type: web_search
      query: "人工智能 AI site:xinhuanet.com"
      language: zh
    - name: "财新 AI"
      type: web_search
      query: "人工智能 大模型 site:caixin.com"
      language: zh
    - name: "第一财经 AI"
      type: web_search
