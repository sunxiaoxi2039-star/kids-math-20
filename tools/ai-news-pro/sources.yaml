# ═══════════════════════════════════════════════════
# 搜索后端配置
# ═══════════════════════════════════════════════════
search_backends:
  # 优先级从高到低，自动选择可用的后端
  tavily:
    env_key: "TAVILY_API_KEY"
    max_results: 5
    search_depth: "advanced"
    include_answer: true
  serpapi:
    env_key: "SERPAPI_KEY"
    max_results: 5
  serper:
    env_key: "SERPER_API_KEY"
    max_results: 5

# LLM 配置（用于分析和评论）
llm:
  # 按优先级排列
  backends:
    - name: anthropic
      env_key: "ANTHROPIC_API_KEY"
      model: "claude-sonnet-4-20250514"
    - name: openai
      env_key: "OPENAI_API_KEY"
      model: "gpt-4o"
    - name: xai
      env_key: "XAI_API_KEY"
      model: "grok-3"
      base_url: "https://api.x.ai/v1"

# 输出配置
output:
  min_total_items: 60
  date_format: "YYYY-MM-DD_资讯"
  pdf_font: "Noto Sans SC"
